name: PR Hygiene

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, milestoned, demilestoned]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-hygiene:
    name: PR Hygiene
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Base branch
        id: branch
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const base = context.payload.pull_request.base.ref;
            const head = context.payload.pull_request.head.ref;

            // develop → main is the only PR allowed to target main
            if (base === 'main' && head !== 'develop') {
              core.setFailed(
                `PRs must target \`develop\`, not \`main\`.\n` +
                `Only the release promotion PR (develop → main) may target main.\n` +
                `Re-open this PR with base: develop.`
              );
            } else {
              core.notice(`✅ Base branch valid: ${head} → ${base}`);
            }

      - name: PR title format
        id: title
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^(feat|fix|chore|docs|test|refactor|perf|ci)\([a-z][a-z0-9-]+\): .{3,}/;
            if (!pattern.test(title)) {
              core.setFailed(
                `PR title "${title}" doesn't match required format.\n` +
                `Expected: type(scope): description\n` +
                `Examples:\n` +
                `  feat(order-book): add independent bid/ask scroll\n` +
                `  fix(tokens): map trading vars to @theme inline\n` +
                `  chore(ci): fix workflow triggers for main-only repo\n` +
                `Valid types: feat, fix, chore, docs, test, refactor, perf, ci`
              );
            } else {
              core.notice(`✅ PR title format valid: "${title}"`);
            }

      - name: Required labels
        id: labels
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const validLabels = ['enhancement', 'bug', 'refactor', 'chore', 'design-system', 'documentation', 'performance', 'test'];
            const hasValid = labels.some(l => validLabels.includes(l));
            if (!hasValid) {
              core.setFailed(
                `PR is missing a required label.\n` +
                `Add one of: ${validLabels.join(', ')}\n` +
                `Labels describe what kind of change this PR contains.`
              );
            } else {
              const matched = labels.filter(l => validLabels.includes(l));
              core.notice(`✅ Labels present: ${matched.join(', ')}`);
            }

      - name: Milestone assignment
        id: milestone
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const milestone = context.payload.pull_request.milestone;
            if (milestone) {
              core.notice(`✅ Milestone assigned: ${milestone.title}`);
            } else {
              core.notice(`ℹ️  No milestone — semantic-release handles versioning automatically.`);
            }

      - name: Documentation freshness
        id: docs
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            if (!title.startsWith('feat(')) {
              core.notice(`ℹ️  Not a feat PR — docs check skipped.`);
              return;
            }

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const changed = files.map(f => f.filename);

            const touchesSrc     = changed.some(f => f.startsWith('src/'));
            const touchesReadme  = changed.includes('README.md');
            const touchesRoadmap = changed.includes('ROADMAP.md');

            if (!touchesSrc) {
              core.notice(`✅ Feat PR doesn't touch src/ — docs check not required.`);
              return;
            }

            const failures = [];
            if (!touchesRoadmap) failures.push('ROADMAP.md not updated');
            if (!touchesReadme)  failures.push('README.md not updated (if applicable)');

            if (failures.length > 0) {
              core.warning(
                `⚠️  Feat PR modifies src/ but docs may need updating:\n` +
                failures.map(f => `  • ${f}`).join('\n') + '\n' +
                `Update ROADMAP.md to reflect progress, and README.md if behaviour changed.\n` +
                `(This is a warning — update if relevant, skip if docs don't apply.)`
              );
            } else {
              core.notice(`✅ Docs up-to-date (ROADMAP.md and README.md updated).`);
            }

      - name: No Co-authored-by trailers
        id: coauthor
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const violations = commits.filter(c =>
              /^co-authored-by:/im.test(c.commit.message)
            );

            if (violations.length > 0) {
              const list = violations
                .map(c => `  • ${c.sha.slice(0, 7)}: ${c.commit.message.split('\n')[0]}`)
                .join('\n');
              core.setFailed(
                `${violations.length} commit(s) contain a Co-authored-by trailer:\n${list}\n\n` +
                `Remove Co-authored-by lines and amend/rebase before merging.\n` +
                `The post-commit hook should prevent this — check your local hook setup.`
              );
            } else {
              core.notice(`✅ No Co-authored-by trailers found in ${commits.length} commit(s).`);
            }

      - name: DCO sign-off
        id: dco
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const missing = commits
              .filter(c => c.parents.length < 2) // skip GitHub-generated merge commits
              .filter(c => !c.commit.message.includes('Signed-off-by:'))
              .map(c => `  ${c.sha.slice(0, 7)} ${c.commit.message.split('\n')[0]}`);

            if (missing.length > 0) {
              core.setFailed(
                `${missing.length} commit(s) are missing a DCO Signed-off-by line:\n${missing.join('\n')}\n\n` +
                `To fix, amend each commit with:\n` +
                `  git commit --amend -s\n\n` +
                `Or use 'git commit -s' for all future commits.\n` +
                `See CONTRIBUTING.md for details.`
              );
            }

      - name: Write job summary
        if: always()
        uses: actions/github-script@v8
        env:
          BRANCH_OUTCOME: ${{ steps.branch.outcome }}
          TITLE_OUTCOME: ${{ steps.title.outcome }}
          LABELS_OUTCOME: ${{ steps.labels.outcome }}
          MILESTONE_OUTCOME: ${{ steps.milestone.outcome }}
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
          COAUTHOR_OUTCOME: ${{ steps.coauthor.outcome }}
          DCO_OUTCOME: ${{ steps.dco.outcome }}
        with:
          script: |
            const icon = o => o === 'success' ? '✅' : o === 'failure' ? '❌' : '⏭️';
            const rows = [
              ['Base branch',            process.env.BRANCH_OUTCOME],
              ['PR title format',        process.env.TITLE_OUTCOME],
              ['Required labels',        process.env.LABELS_OUTCOME],
              ['Milestone',              process.env.MILESTONE_OUTCOME],
              ['Documentation freshness',process.env.DOCS_OUTCOME],
              ['No Co-authored-by',      process.env.COAUTHOR_OUTCOME],
              ['DCO sign-off',           process.env.DCO_OUTCOME],
            ];
            const table = rows.map(([name, outcome]) =>
              `| ${icon(outcome)} ${name} | \`${outcome}\` |`
            ).join('\n');
            await core.summary
              .addHeading('PR Hygiene Results')
              .addRaw(`| Check | Result |\n|---|---|\n${table}`)
              .write();

      - name: Fail if any check failed
        if: always()
        uses: actions/github-script@v8
        env:
          BRANCH_OUTCOME: ${{ steps.branch.outcome }}
          TITLE_OUTCOME: ${{ steps.title.outcome }}
          LABELS_OUTCOME: ${{ steps.labels.outcome }}
          COAUTHOR_OUTCOME: ${{ steps.coauthor.outcome }}
          DCO_OUTCOME: ${{ steps.dco.outcome }}
        with:
          script: |
            const failures = [
              ['Base branch',        process.env.BRANCH_OUTCOME],
              ['PR title format',    process.env.TITLE_OUTCOME],
              ['Required labels',    process.env.LABELS_OUTCOME],
              ['No Co-authored-by',  process.env.COAUTHOR_OUTCOME],
              ['DCO sign-off',       process.env.DCO_OUTCOME],
            ].filter(([, o]) => o === 'failure').map(([name]) => name);

            if (failures.length > 0) {
              core.setFailed(`${failures.length} check(s) failed: ${failures.join(', ')}`);
            }

